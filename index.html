<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Gun Van Tracker</title>
    
    <!-- Librería del mapa (Leaflet CSS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        .header { 
            padding: 12px; 
            text-align: center; 
            background: #1e1e1e; 
            border-bottom: 2px solid #ff9800; 
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff9800; }
        .zone { font-size: 15px; color: #4caf50; font-weight: bold; }
        
        /* Contenedor del mapa */
        #map { 
            height: 380px; 
            width: 100%; 
            background: #0fa8d2; /* Fondo de agua */
        }
        
        .info-card { 
            padding: 15px; 
            background: #1e1e1e; 
        }
        ul { list-style: none; padding: 0; margin: 10px 0 0 0; }
        li { background: #2c2c2c; margin: 5px 0; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚚 Gun Van - GTA Online</h1>
        <div id="zone-name" class="zone">Cargando mapa...</div>
    </div>

    <!-- Mapa interactivo -->
    <div id="map"></div>

    <div class="info-card">
        <h3>🔫 Armas del día:</h3>
        <ul id="weapons-list"></ul>
    </div>

    <!-- Librería del mapa (Leaflet JS) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializamos el mapa con coordenadas de GTA V
        const map = L.map('map', {
            center: [0, 0],
            zoom: 3,
            minZoom: 2,
            maxZoom: 5
        });

        // 2. Cargamos las teselas (tiles) HD del mapa de GTA V
        L.tileLayer('https://s.rsg.sc/sc/images/games/GTAV/map/satellite/{z}/{x}/{y}.jpg', {
            attribution: 'Rockstar Games',
            noWrap: true
        }).addTo(map);

        // 3. Leemos tu archivo gun_van.json de GitHub
        fetch('gun_van.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('zone-name').innerText = data.zone || data.location_name;

                // Cargamos la lista de armas
                let listHTML = data.weapons.map(arma => `<li>🔫 ${arma}</li>`).join('');
                document.getElementById('weapons-list').innerHTML = listHTML;

                // 4. Ubicamos el marcador en el mapa
                // Si lat/lng no están definidas, ponemos un punto por defecto
                const lat = data.latitude || -20;
                const lng = data.longitude || 0;

                const marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup(`<b>${data.zone}</b><br>¡La Gun Van está acá!`).openPopup();
                
                // Centramos la cámara en el marcador
                map.setView([lat, lng], 3);
            })
            .catch(err => {
                document.getElementById('zone-name').innerText = 'Error al cargar los datos';
            });
    </script>
</body>
</html>
