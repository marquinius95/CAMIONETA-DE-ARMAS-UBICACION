<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Gun Van Tracker</title>
    
    <!-- Librería del mapa (Leaflet CSS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        .header { 
            padding: 8px 12px; 
            text-align: center; 
            background: #1e1e1e; 
            border-bottom: 2px solid #ff9800; 
        }
        h1 { margin: 0; font-size: 16px; color: #ff9800; }
        .zone { font-size: 14px; color: #4caf50; font-weight: bold; }
        
        /* Mapa más compacto y cómodo */
        #map { 
            height: 280px; 
            width: 100%; 
            background: #0b2545; 
        }
        
        .info-card { 
            padding: 10px 15px; 
            background: #1e1e1e; 
        }
        .info-card h3 { 
            margin: 0 0 6px 0; 
            font-size: 14px; 
            color: #ff9800; 
        }
        
        /* Lista de armas compacta */
        ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        li { 
            background: #2c2c2c; 
            padding: 6px 10px; 
            border-radius: 6px; 
            font-size: 13px; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚚 Gun Van - GTA Online</h1>
        <div id="zone-name" class="zone">Cargando ubicación...</div>
    </div>

    <!-- Mapa interactivo compacto -->
    <div id="map"></div>

    <div class="info-card">
        <h3>🔫 Armas del día:</h3>
        <ul id="weapons-list"></ul>
    </div>

    <!-- Librería del mapa (Leaflet JS) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3,
            zoomSnap: 0.5
        });

        const bounds = [[0, 0], [2048, 4096]]; 
        const mapImage = 'map.jpg'; 
        
        L.imageOverlay(mapImage, bounds).addTo(map);
        map.fitBounds(bounds);

        fetch('gun_van.json')
            .text()
            .then(text => JSON.parse(text))
            .then(data => {
                document.getElementById('zone-name').innerText = data.zone;

                let listHTML = data.weapons.map(arma => `<li>🔫 ${arma}</li>`).join('');
                document.getElementById('weapons-list').innerHTML = listHTML;

                const posY = data.latitude || 1024;
                const posX = data.longitude || 2048;

                const marker = L.marker([posY, posX]).addTo(map);
                marker.bindPopup(`<b>${data.zone}</b><br>¡La Gun Van está acá!`).openPopup();
                
                map.setView([posY, posX], 0);
            })
            .catch(err => {
                document.getElementById('zone-name').innerText = 'Error al cargar los datos';
            });
    </script>
</body>
</html>
