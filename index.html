<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Gun Van Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            padding: 8px; 
            text-align: center; 
            background: #1e1e1e; 
            border-bottom: 2px solid #ff9800; 
            flex-shrink: 0;
            z-index: 1000;
        }
        h1 { margin: 0; font-size: 16px; color: #ff9800; }
        .zone { font-size: 13px; color: #4caf50; font-weight: bold; margin-top: 2px; }
        
        /* Contenedor del mapa a pantalla completa */
        #map { 
            flex: 1;
            width: 100%; 
            background: #0b2545; 
        }

        /* Mejora la calidad y suavizado de la imagen del mapa en los navegadores */
        .leaflet-image-layer {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚚 Gun Van - GTA Online</h1>
        <div id="zone-name" class="zone">Cargando ubicación...</div>
    </div>

    <!-- Mapa interactivo -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3,
            zoomSnap: 0.5
        });

        const bounds = [[0, 0], [2048, 2048]]; 
        const mapImage = 'map.jpg'; 
        
        L.imageOverlay(mapImage, bounds).addTo(map);
        map.fitBounds(bounds);

        // Cargamos los datos evitando caché
        fetch('gun_van.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                document.getElementById('zone-name').innerText = data.zone;

                const posY = data.latitude || 1024;
                const posX = data.longitude || 1024;

                const marker = L.marker([posY, posX]).addTo(map);
                marker.bindPopup(`<b>${data.zone}</b><br>¡La Gun Van está acá!`).openPopup();
                
                map.setView([posY, posX], 0);
            })
            .catch(err => {
                document.getElementById('zone-name').innerText = 'Error al cargar los datos';
            });
    </script>
</body>
</html>
