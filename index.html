<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Gun Van Tracker</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            padding: 8px; 
            text-align: center; 
            background: #1e1e1e; 
            border-bottom: 2px solid #ff9800; 
            flex-shrink: 0;
            z-index: 1000;
        }
        h1 { margin: 0; font-size: 16px; color: #ff9800; }
        .zone { font-size: 13px; color: #4caf50; font-weight: bold; margin-top: 2px; }
        
        /* Contenedor con scroll para movernos por el mapa gigante de 4096px */
        #map-container {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #0b2545;
        }

        #map-image {
            display: block;
            width: 4096px;
            height: 4096px;
            cursor: crosshair;
        }

        /* El marcador posicionado exactamente por píxeles puros */
        .van-marker {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #ff9800;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transform: translate(-50%, -50%);
            z-index: 500;
            pointer-events: none;
        }

        .van-popup {
            position: absolute;
            background: #1e1e1e;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #ff9800;
            transform: translate(-50%, -45px);
            white-space: nowrap;
            z-index: 501;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Caja flotante abajo a la izquierda para ver los píxeles del mouse */
        #pixel-tracker {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(18, 18, 18, 0.9);
            color: #00ffcc;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            z-index: 2000;
            border: 1px solid #ff9800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚚 Gun Van - GTA Online</h1>
        <div id="zone-name" class="zone">Cargando ubicación...</div>
    </div>

    <!-- Contenedor del mapa plano -->
    <div id="map-container">
        <div style="position: relative; width: 4096px; height: 4096px;">
            <img id="map-image" src="map.jpg" alt="Mapa GTA V">
            <div id="marker" class="van-marker" style="display: none;">
                <div id="popup" class="van-popup"></div>
            </div>
        </div>
    </div>

    <!-- Indicador de coordenadas en vivo -->
    <div id="pixel-tracker">X: 0 | Y: 0</div>

<script>
        const mapImage = document.getElementById('map-image');
        const tracker = document.getElementById('pixel-tracker');
        const container = document.getElementById('map-container');

        // Mostrar coordenadas exactas en tiempo real al mover el mouse sobre el mapa
        mapImage.addEventListener('mousemove', (e) => {
            const x = Math.round(e.offsetX);
            const y = Math.round(e.offsetY);
            tracker.innerText = `X (Left): ${x} | Y (Top): ${y}`;
        });

        // ==========================================
        // MEJORAS PARA PC: Arrastrar fluido y Clic Derecho
        // ==========================================
        const esPC = window.matchMedia('(pointer: fine)').matches;

        if (esPC) {
            let estaArrastrando = false;
            let inicioX, inicioY, scrollLeft, scrollTop;

            container.style.cursor = 'grab';

            container.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return; // Solo clic izquierdo
                estaArrastrando = true;
                container.style.cursor = 'grabbing';
                inicioX = e.pageX;
                inicioY = e.pageY;
                scrollLeft = container.scrollLeft;
                scrollTop = container.scrollTop;
                e.preventDefault(); // Evita selección de texto
            });

            // Escuchamos a nivel global (window) para que no se trabe si el mouse sale del contenedor
            window.addEventListener('mousemove', (e) => {
                if (!estaArrastrando) return;
                const movimientoX = e.pageX - inicioX;
                const movimientoY = e.pageY - inicioY;
                container.scrollLeft = scrollLeft - movimientoX;
                container.scrollTop = scrollTop - movimientoY;
            });

            window.addEventListener('mouseup', () => {
                if (estaArrastrando) {
                    estaArrastrando = false;
                    container.style.cursor = 'grab';
                }
            });

            // Clic derecho para inspeccionar coordenadas exactas de píxeles
            container.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const rect = mapImage.getBoundingClientRect();
                const xPixel = Math.round(e.clientX - rect.left);
                const yPixel = Math.round(e.clientY - rect.top);
                alert(`Coordenadas del mapa:\nLeft (X): ${xPixel}\nTop (Y): ${yPixel}`);
            });
        }
        // ==========================================

        fetch('gun_van.json?v=' + new Date().getTime() + '&cache=' + Math.random())
            .then(response => response.json())
            .then(data => {
                document.getElementById('zone-name').innerText = data.zone;

                const posY = data.latitude; 
                const posX = data.longitude; 

                const marker = document.getElementById('marker');
                const popup = document.getElementById('popup');

                marker.style.top = posY + 'px';
                marker.style.left = posX + 'px';
                popup.innerHTML = `<b>${data.zone}</b><br>¡La Gun Van está acá!`;
                marker.style.display = 'block';

                // Centrar automáticamente el scroll en la ubicación actual
                container.scrollTop = posY - (container.clientHeight / 2);
                container.scrollLeft = posX - (container.clientWidth / 2);
            })
            .catch(err => {
                document.getElementById('zone-name').innerText = 'Error al cargar los datos';
            });
    </script>
</body>
</html>
