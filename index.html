<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Gun Van Tracker</title>
    
    <!-- Librería del mapa (Leaflet CSS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        .header { 
            padding: 12px; 
            text-align: center; 
            background: #1e1e1e; 
            border-bottom: 2px solid #ff9800; 
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff9800; }
        .zone { font-size: 15px; color: #4caf50; font-weight: bold; }
        
        /* Contenedor del mapa interactivo */
        #map { 
            height: 400px; 
            width: 100%; 
            background: #0b2545; 
        }
        
        .info-card { 
            padding: 15px; 
            background: #1e1e1e; 
        }
        ul { list-style: none; padding: 0; margin: 10px 0 0 0; }
        li { background: #2c2c2c; margin: 5px 0; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚚 Gun Van - GTA Online</h1>
        <div id="zone-name" class="zone">Cargando ubicación...</div>
    </div>

    <!-- Mapa interactivo -->
    <div id="map"></div>

    <div class="info-card">
        <h3>🔫 Armas del día:</h3>
        <ul id="weapons-list"></ul>
    </div>

    <!-- Librería del mapa (Leaflet JS) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializamos el mapa interactivo en modo plano
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3,
            zoomSnap: 0.5
        });

        // 2. Límites adaptados para una imagen horizontal (Alto: 2048, Ancho: 4096)
        const bounds = [[0, 0], [2048, 4096]]; 
        const mapImage = 'map.jpg'; 
        
        L.imageOverlay(mapImage, bounds).addTo(map);
        map.fitBounds(bounds);

        // 3. Leemos tu archivo gun_van.json de GitHub
        fetch('gun_van.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('zone-name').innerText = data.zone;

                // Cargamos la lista de armas
                let listHTML = data.weapons.map(arma => `<li>🔫 ${arma}</li>`).join('');
                document.getElementById('weapons-list').innerHTML = listHTML;

                // 4. Ubicamos el marcador de la Gun Van
                // Invertimos el orden para formato horizontal (latitude = Y, longitude = X)
                const posY = data.latitude || 1024;
                const posX = data.longitude || 2048;

                const marker = L.marker([posY, posX]).addTo(map);
                marker.bindPopup(`<b>${data.zone}</b><br>¡La Gun Van está acá!`).openPopup();
                
                // Centramos la cámara en la camioneta
                map.setView([posY, posX], 0);
            })
            .catch(err => {
                document.getElementById('zone-name').innerText = 'Error al cargar los datos';
            });
    </script>
</body>
</html>
