<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Gun Van Tracker</title>
    
    <!-- Librería del mapa (Leaflet CSS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        .header { 
            padding: 8px; 
            text-align: center; 
            background: #1e1e1e; 
            border-bottom: 2px solid #ff9800; 
        }
        h1 { margin: 0; font-size: 15px; color: #ff9800; }
        .zone { font-size: 13px; color: #4caf50; font-weight: bold; }
        
        /* Mapa proporcionado y limpio */
        #map { 
            height: 320px; 
            width: 100%; 
            background: #0b2545; 
        }
        
        /* Tarjeta de armas compacta abajo */
        .info-card { 
            padding: 8px 12px; 
            background: #1e1e1e; 
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
        }
        .info-card h3 { 
            margin: 0; 
            font-size: 12px; 
            color: #ff9800; 
            white-space: nowrap; 
        }
        
        /* Lista de armas en una sola línea horizontal compacta */
        ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: flex; 
            gap: 6px; 
        }
        li { 
            background: #2c2c2c; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 12px; 
            white-space: nowrap; 
            border: 1px solid #3d3d3d;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚚 Gun Van - GTA Online</h1>
        <div id="zone-name" class="zone">Cargando ubicación...</div>
    </div>

    <!-- Mapa interactivo -->
    <div id="map"></div>

    <!-- Sección de armas ultra compacta -->
    <div class="info-card">
        <h3>Armas:</h3>
        <ul id="weapons-list"></ul>
    </div>

    <!-- Librería del mapa (Leaflet JS) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inicializamos el mapa con proporción cuadrada real
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 3,
            zoomSnap: 0.5
        });

        const bounds = [[0, 0], [2048, 2048]]; 
        const mapImage = 'map.jpg'; 
        
        L.imageOverlay(mapImage, bounds).addTo(map);
        map.fitBounds(bounds);

        fetch('gun_van.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('zone-name').innerText = data.zone;

                // Armas en formato etiqueta chica
                let listHTML = data.weapons.map(arma => `<li>🔫 ${arma}</li>`).join('');
                document.getElementById('weapons-list').innerHTML = listHTML;

                // Coordenadas exactas dentro del mapa cuadrado (0 a 2048)
                const posY = data.latitude || 1024;
                const posX = data.longitude || 1024;

                const marker = L.marker([posY, posX]).addTo(map);
                marker.bindPopup(`<b>${data.zone}</b><br>¡La Gun Van está acá!`).openPopup();
                
                map.setView([posY, posX], 1);
            })
            .catch(err => {
                document.getElementById('zone-name').innerText = 'Error al cargar los datos';
            });
    </script>
</body>
</html>
