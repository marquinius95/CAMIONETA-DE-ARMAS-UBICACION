<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Gun Van Tracker</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            padding: 8px; 
            text-align: center; 
            background: #1e1e1e; 
            border-bottom: 2px solid #ff9800; 
            flex-shrink: 0;
            z-index: 1000;
        }
        h1 { margin: 0; font-size: 16px; color: #ff9800; }
        .zone { font-size: 13px; color: #4caf50; font-weight: bold; margin-top: 2px; }
        
        /* Contenedor con scroll para movernos por el mapa gigante de 4096px */
        #map-container {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #0b2545;
        }

        #map-image {
            display: block;
            width: 4096px;
            height: 4096px;
        }

        /* El marcador posicionado exactamente por píxeles puros */
        .van-marker {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #ff9800;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transform: translate(-50%, -50%);
            z-index: 500;
            cursor: pointer;
        }

        .van-popup {
            position: absolute;
            background: #1e1e1e;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #ff9800;
            transform: translate(-50%, -45px);
            white-space: nowrap;
            z-index: 501;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚚 Gun Van - GTA Online</h1>
        <div id="zone-name" class="zone">Cargando ubicación...</div>
    </div>

    <!-- Contenedor del mapa plano -->
    <div id="map-container">
        <div style="position: relative; width: 4096px; height: 4096px;">
            <img id="map-image" src="map.jpg" alt="Mapa GTA V">
            <div id="marker" class="van-marker" style="display: none;">
                <div id="popup" class="van-popup"></div>
            </div>
        </div>
    </div>

    <script>
        fetch('gun_van.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                document.getElementById('zone-name').innerText = data.zone;

                // Coordenadas directas en píxeles (Y = distancia desde arriba, X = distancia desde la izquierda)
                const posY = data.latitude; 
                const posX = data.longitude; 

                const marker = document.getElementById('marker');
                const popup = document.getElementById('popup');

                marker.style.top = posY + 'px';
                marker.style.left = posX + 'px';
                popup.innerHTML = `<b>${data.zone}</b><br>¡La Gun Van está acá!`;
                marker.style.display = 'block';

                // Centrar automáticamente el scroll de la pantalla justo en el marcador
                const container = document.getElementById('map-container');
                container.scrollTop = posY - (container.clientHeight / 2);
                container.scrollLeft = posX - (container.clientWidth / 2);
            })
            .catch(err => {
                document.getElementById('zone-name').innerText = 'Error al cargar los datos';
            });
    </script>
</body>
</html>
