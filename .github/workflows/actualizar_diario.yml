name: Actualizar Gun Van con Navegador Real

on:
  schedule:
    - cron: '0 7 * * *' # Todos los días a las 7:00 UTC
  workflow_dispatch: # Permite la ejecución manual desde la pestaña Actions

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para subir los cambios al repo

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar script de extracción con navegador
        run: python actualizar.py
- name: Subir cambios al repositorio automáticamente
        run: |
          git config --global user.name "Bot Gun Van Playwright"
          git config --global user.email "bot@users.noreply.github.com"
          
          # Mostramos el estado actual para depurar en los logs de GitHub
          git status
          
          git add gun_van.json
          
          # Verificamos si realmente hay cambios para confirmar y subir
          if git diff --staged --quiet; then
            echo "::notice::No hay cambios detectados en gun_van.json respecto al repositorio."
          else
            git commit -m "Actualización automática de la ubicación de la Gun Van"
            git push origin HEAD
            echo "::notice::¡Cambios subidos y actualizados con éxito!"
          fi
