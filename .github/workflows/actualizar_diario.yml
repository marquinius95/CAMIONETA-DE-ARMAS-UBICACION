name: Actualizar Gun Van Diariamente

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

# ESTO ES LO NUEVO: Le da permiso al robot para guardar cambios
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script de actualización
        run: python actualizar.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add gun_van.json
          git diff-index --quiet HEAD || git commit -m "🤖 Ubicación diaria de la Gun Van actualizada"
          git push
