name: Actualizar Gun Van Real

on:
  schedule:
    - cron: '0 7 * * *' # Corre todos los días a las 7:00 UTC
  workflow_dispatch: # Permite probarlo de forma manual desde la pestaña Actions

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para hacer commit y push

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar herramientas necesarias (Cloudscraper)
        run: pip install cloudscraper requests

      - name: Ejecutar script de extracción real
        run: python actualizar.py

      - name: Subir cambios al repositorio de forma automática
        run: |
          git config --global user.name "Bot Gun Van Real"
          git config --global user.email "bot@users.noreply.github.com"
          git add gun_van.json
          git diff --staged --quiet || (git commit -m "Actualización automática de la ubicación real de la Gun Van" && git push)
