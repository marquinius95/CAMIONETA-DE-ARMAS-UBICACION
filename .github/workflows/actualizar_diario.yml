name: Actualizar Gun Van

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 08:00 UTC
  workflow_dispatch: # Permite ejecutarlo a mano desde la pestaña Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar script de actualización
        run: python actualizar.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "Bot Gun Van"
          git config --global user.email "bot@users.noreply.github.com"
          git add gun_van.json
          git commit -m "Actualización automática Gun Van: $(date +%Y-%m-%d)" || exit 0
          git push
